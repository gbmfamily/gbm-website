<!-- Renders a leader photo or initial placeholder -->
<!-- Usage: {% include leader-photo.html photo=leader.photo name=leader.name size="56" %} -->
{% if include.photo and include.photo != "" %}
<div class="leader-photo-wrapper" style="width:{{ include.size }}px;height:{{ include.size }}px;border-radius:50%;overflow:hidden;flex-shrink:0;">
  <img src="{{ include.photo | relative_url }}" alt="{{ include.name }}" />
</div>
{% else %}
<div class="leader-photo-placeholder" style="width:{{ include.size }}px;height:{{ include.size }}px;border-radius:50%;background:var(--depth-blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
  <span style="font-family:var(--font-display);font-weight:800;color:white;font-size:1.2rem;">{{ include.name | split: " " | last | slice: 0 }}</span>
</div>
{% endif %}
