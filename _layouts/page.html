---
layout: default
---

<section class="page-hero">
  <div class="container">
    {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
  </div>
</section>

<div class="page-body container">
  {{ content }}
</div>
